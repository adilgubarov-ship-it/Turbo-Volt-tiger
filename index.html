<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Volt Tiger</title>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="min-h-screen flex flex-col items-center p-6 text-center">
        <div class="mt-10 mb-8">
            <img src="1777570437420.png" alt="Tiger" class="w-64 h-64 mx-auto rounded-full shadow-[0_0_50px_rgba(251,146,60,0.4)] animate-pulse">
        </div>

        <h1 class="text-4xl font-black text-orange-500 mb-2 italic italic uppercase">TURBO VOLT TIGER</h1>
        
        <div class="w-full max-w-md my-8">
            <div class="bg-gray-800 p-4 rounded-2xl border-2 border-orange-500 flex flex-col md:flex-row items-center gap-3">
                <code id="ca" class="text-orange-400 font-mono text-sm break-all">ВСТАВЬ_АДРЕС_ТУТ</code>
                <button onclick="copyCA()" class="bg-orange-500 px-6 py-2 rounded-xl font-bold uppercase text-xs">COPY</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl w-full text-left">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <h3 class="text-orange-400 font-bold mb-2">Phase 1: Spark</h3>
                <p class="text-gray-400 text-sm">Launch on Solana & Community build.</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <h3 class="text-orange-400 font-bold mb-2">Phase 2: Roar</h3>
                <p class="text-gray-400 text-sm">Marketing & DEX Listings.</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
                <h3 class="text-orange-400 font-bold mb-2">Phase 3: Moon</h3>
                <p class="text-gray-400 text-sm">To the moon and beyond!</p>
            </div>
        </div>
    </div>

    <script>
    function copyCA() {
        const ca = document.getElementById('ca').innerText;
        navigator.clipboard.writeText(ca);
        alert("Copied! ⚡");
    }
    </script>
</body>
</html>
